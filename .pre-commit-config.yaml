repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: ["--strict", "server/arb"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: dashboard-eslint
        name: dashboard-eslint
        entry: bash -lc 'cd dashboard && npm run lint'
        language: system
        pass_filenames: false
        files: ^dashboard/
      - id: dashboard-typecheck
        name: dashboard-typecheck
        entry: bash -lc 'cd dashboard && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^dashboard/
